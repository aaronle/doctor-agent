services:
  doctor-agent:
    build:
      context: ../..
      dockerfile: deploy/tencent-guangzhou/Dockerfile
    image: doctor-agent:0.2.0-mvp
    container_name: doctor-agent-mvp
    restart: unless-stopped
    env_file:
      - /opt/doctor-agent/config/.env.runtime
    ports:
      - "127.0.0.1:3400:8000"
    volumes:
      - /opt/doctor-agent/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
